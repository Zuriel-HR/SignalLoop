quarkus.application.name=signalloop-central
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SIGNALLOOP_DB_USERNAME:postgres}
quarkus.datasource.password=${SIGNALLOOP_DB_PASSWORD}
quarkus.datasource.jdbc.url=${SIGNALLOOP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/signalloop}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.default-schema=public
quarkus.flyway.schemas=public,project,simulator
# V001 ya aplicado a mano: no reejecutar CREATE TABLE. Una base vacía sí recibe V001.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=V001 restored outside Flyway

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/signalloop_test
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.flyway.clean-at-start=true

quarkus.smallrye-openapi.info-title=SignalLoop Central
quarkus.smallrye-openapi.info-version=0.2.0
quarkus.smallrye-openapi.info-description=PostgreSQL-backed project and simulator sequence API. SPEC-0002 is Draft.
quarkus.swagger-ui.path=/q/swagger-ui
%prod.quarkus.smallrye-openapi.enable=false
%prod.quarkus.swagger-ui.enable=false

quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.smallrye-health.root-path=/health

quarkus.log.level=INFO
quarkus.log.category."io.signalloop".level=INFO
%dev.quarkus.log.category."io.signalloop".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
