[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalloop-aprendiz"
version = "0.1.0"
description = "Aprendiz de SignalLoop (modo Mixto): aprende lecciones declarativas de las corridas del intérprete"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.40"]

[project.scripts]
aprendiz = "aprendiz.cli:main"

[tool.setuptools]
packages = ["aprendiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
